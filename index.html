<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Easy Gift</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #0a0a0f 0%, #1a1a2e 100%);
            color: white;
            overflow-x: hidden;
        }
        body {
            height: 75vh;
            max-height: 75vh;
            overflow-y: auto;
            border-radius: 20px 20px 0 0;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .top-bar .left {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .top-bar .profile-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #000;
            overflow: hidden;
            flex-shrink: 0;
        }
        .top-bar .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .top-bar .profile-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .top-bar .profile-name {
            font-size: 14px;
            font-weight: 600;
            color: white;
        }
        .top-bar .profile-username {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
        }
        .top-bar .stars-info {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            margin-left: auto;
            padding-left: 10px;
        }
        .top-bar .stars-info strong { color: #ffd700; }
        .top-bar .right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-bar .icon-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 5px 10px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }
        .top-bar .icon-btn:hover { background: rgba(255,255,255,0.15); }
        .top-bar .icon-btn .plus { color: #ffd700; font-weight: 700; }
        
        .live-track {
            padding: 10px 16px;
            background: rgba(255,215,0,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
        }
        .live-track .live-badge {
            display: inline-block;
            background: #ff0040;
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 3px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .live-track .track-scroll {
            display: flex;
            gap: 40px;
            white-space: nowrap;
            animation: scrollTrack 18s linear infinite;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
        }
        .live-track .track-scroll .item { display: inline-block; }
        .live-track .track-scroll .item .win { color: #ffd700; font-weight: 600; }
        .live-track .track-scroll .item .nft { color: #00d4ff; font-weight: 600; }
        @keyframes scrollTrack { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        
        .content { padding: 16px; padding-bottom: 80px; }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }
        .case-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .case-item:hover { transform: scale(1.03); border-color: rgba(255,215,0,0.3); }
        .case-item .case-icon { font-size: 28px; margin-bottom: 4px; }
        .case-item .case-name { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.9); }
        .case-item .case-price { font-size: 10px; color: #ffd700; margin-top: 2px; }
        .case-item .case-progress {
            width: 100%; height: 3px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
        }
        .case-item .case-progress .fill {
            height: 100%;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            border-radius: 3px;
            transition: width 0.5s;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            padding-bottom: env(safe-area-inset-bottom, 6px);
            z-index: 200;
        }
        .bottom-nav .tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            padding: 4px 16px;
            border-radius: 12px;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            font-weight: 500;
        }
        .bottom-nav .tab.active { color: #ffd700; }
        .bottom-nav .tab .icon { font-size: 20px; }
        .bottom-nav .tab .label { font-size: 9px; }
        .bottom-nav .tab:hover { background: rgba(255,255,255,0.05); }
        
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 13px;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        
        .profile-popup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 300;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .profile-popup.show { display: flex; }
        .profile-popup .popup-content {
            background: linear-gradient(145deg, #1a1a2e, #2a2a4a);
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .profile-popup .popup-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: #000;
            margin: 0 auto 12px;
            overflow: hidden;
            border: 3px solid rgba(255,215,0,0.3);
        }
        .profile-popup .popup-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-popup .popup-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .profile-popup .popup-username {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 16px;
        }
        .profile-popup .popup-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 16px 0;
            padding: 16px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .profile-popup .popup-stats .stat { text-align: center; }
        .profile-popup .popup-stats .stat .num {
            font-size: 20px;
            font-weight: 700;
            color: #ffd700;
        }
        .profile-popup .popup-stats .stat .label {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-top: 2px;
        }
        .profile-popup .popup-close {
            padding: 12px 40px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 8px;
        }
        .profile-popup .popup-close:hover { background: rgba(255,255,255,0.15); }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>
    <!-- ===== ВЕРХНЯЯ ПАНЕЛЬ ===== -->
    <div class="top-bar">
        <div class="left" onclick="openProfile()">
            <div class="profile-avatar" id="avatarContainer">👤</div>
            <div class="profile-info">
                <div class="profile-name" id="profileName">Загрузка...</div>
                <div class="profile-username" id="profileUsername">@username</div>
            </div>
            <div class="stars-info">
                ⭐ <strong id="userStars">0</strong>
            </div>
        </div>
        <div class="right">
            <button class="icon-btn" onclick="buyStars()">
                <span class="plus">+</span> Gram
            </button>
            <button class="icon-btn" onclick="addStars()">
                ⭐ <span class="plus">+</span>
            </button>
        </div>
    </div>
    
    <!-- ===== LIVE ЛЕНТА ===== -->
    <div class="live-track">
        <span class="live-badge">LIVE</span>
        <div class="track-scroll" id="trackScroll"></div>
    </div>
    
    <!-- ===== КОНТЕНТ ===== -->
    <div class="content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-size:16px;font-weight:600;">🔥 Популярные кейсы</span>
            <span style="font-size:12px;color:rgba(255,255,255,0.4);">Смотреть все →</span>
        </div>
        
        <div class="cases-grid">
            <div class="case-item" onclick="openCase('67 Capsule', 5)">
                <div class="case-icon">🎁</div>
                <div class="case-name">67 Capsule</div>
                <div class="case-price">⭐ 5 / 50000</div>
                <div class="case-progress"><div class="fill" style="width:0.01%"></div></div>
            </div>
            <div class="case-item" onclick="openCase('Diamond Box', 10)">
                <div class="case-icon">💎</div>
                <div class="case-name">Diamond Box</div>
                <div class="case-price">⭐ 10 / 1000</div>
                <div class="case-progress"><div class="fill" style="width:1%"></div></div>
            </div>
            <div class="case-item" onclick="openCase('Gold Rush', 3)">
                <div class="case-icon">🔥</div>
                <div class="case-name">Gold Rush</div>
                <div class="case-price">⭐ 3 / 500</div>
                <div class="case-progress"><div class="fill" style="width:0.6%"></div></div>
            </div>
            <div class="case-item" onclick="openCase('Moon Box', 8)">
                <div class="case-icon">🚀</div>
                <div class="case-name">Moon Box</div>
                <div class="case-price">⭐ 8 / 2500</div>
                <div class="case-progress"><div class="fill" style="width:0.32%"></div></div>
            </div>
            <div class="case-item" onclick="openCase('Royal Chest', 2)">
                <div class="case-icon">👑</div>
                <div class="case-name">Royal Chest</div>
                <div class="case-price">⭐ 2 / 100</div>
                <div class="case-progress"><div class="fill" style="width:2%"></div></div>
            </div>
            <div class="case-item" onclick="openCase('Star Pack', 1)">
                <div class="case-icon">🌟</div>
                <div class="case-name">Star Pack</div>
                <div class="case-price">⭐ 1 / 50</div>
                <div class="case-progress"><div class="fill" style="width:2%"></div></div>
            </div>
        </div>
    </div>
    
    <!-- ===== НИЖНЯЯ ПАНЕЛЬ ===== -->
    <div class="bottom-nav">
        <button class="tab active" data-tab="cases">
            <span class="icon">📦</span>
            <span class="label">Кейсы</span>
        </button>
        <button class="tab" data-tab="modes">
            <span class="icon">⚡</span>
            <span class="label">Режимы</span>
        </button>
        <button class="tab" data-tab="profile">
            <span class="icon">👤</span>
            <span class="label">Профиль</span>
        </button>
    </div>
    
    <!-- ===== ПРОФИЛЬ (ПОПАП) ===== -->
    <div class="profile-popup" id="profilePopup">
        <div class="popup-content">
            <div class="popup-avatar" id="popupAvatar">👤</div>
            <div class="popup-name" id="popupName">User</div>
            <div class="popup-username" id="popupUsername">@username</div>
            
            <div class="popup-stats">
                <div class="stat">
                    <div class="num" id="popupBalance">0</div>
                    <div class="label">⭐ Баланс</div>
                </div>
                <div class="stat">
                    <div class="num" id="popupEarned">0</div>
                    <div class="label">💰 Заработано</div>
                </div>
                <div class="stat">
                    <div class="num" id="popupNfts">0</div>
                    <div class="label">🖼 NFT</div>
                </div>
                <div class="stat">
                    <div class="num" id="popupGifts">0</div>
                    <div class="label">🎁 Гифтов</div>
                </div>
                <div class="stat">
                    <div class="num" id="popupSpent">0</div>
                    <div class="label">📊 Спинов</div>
                </div>
            </div>
            
            <button class="popup-close" onclick="closeProfile()">✕ Закрыть</button>
        </div>
    </div>
    
    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>
    
    <script>
        // ========== TELEGRAM WEB APP ==========
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.enableClosingConfirmation(); }
        
        // ========== РАСШИРЕНИЕ ==========
        function expandApp() {
            if (tg) {
                tg.expand();
                const height = Math.floor(window.innerHeight * 0.75);
                document.body.style.height = height + 'px';
                document.body.style.maxHeight = height + 'px';
            }
        }
        window.addEventListener('load', expandApp);
        window.addEventListener('resize', function() {
            if (tg) {
                const height = Math.floor(window.innerHeight * 0.75);
                document.body.style.height = height + 'px';
                document.body.style.maxHeight = height + 'px';
            }
        });
        
        // ========== ДАННЫЕ ==========
        let userData = {
            stars: 0,
            totalEarned: 0,
            totalSpent: 0,
            giftsReceived: 0,
            nfts: [],
            nftCount: 0,
            username: '',
            firstName: 'User',
            lastName: '',
            photoUrl: null
        };
        
        // ========== ЗАПРОС ДАННЫХ ==========
        function fetchUserData() {
            if (tg) {
                tg.sendData(JSON.stringify({ action: 'get_user_data' }));
            }
        }
        
        function fetchLiveFeed() {
            if (tg) {
                tg.sendData(JSON.stringify({ action: 'get_live_feed' }));
            }
        }
        
        // ========== ОБРАБОТКА ОТВЕТОВ ==========
        window.handleBotResponse = function(data) {
            try {
                if (data.balance !== undefined) {
                    userData.stars = data.balance;
                    userData.totalEarned = data.total_earned || 0;
                    userData.totalSpent = data.total_spent || 0;
                    userData.giftsReceived = data.gifts_received || 0;
                    userData.nfts = data.nfts || [];
                    userData.nftCount = data.nft_count || 0;
                    userData.username = data.username || '';
                    userData.firstName = data.first_name || 'User';
                    userData.lastName = data.last_name || '';
                    userData.photoUrl = data.photo_url || null;
                    updateUI();
                }
                
                if (data.live_feed) {
                    updateLiveFeed(data.live_feed);
                }
                
                if (data.status === 'win') {
                    userData.stars = data.balance;
                    if (data.nft) { userData.nfts.push(data.nft); userData.nftCount++; }
                    updateUI();
                    showToast('🎉 Ты выиграл ' + data.nft + '!');
                    fetchLiveFeed();
                } else if (data.status === 'lose') {
                    userData.stars = data.balance;
                    updateUI();
                    showToast('😞 Не повезло! Попробуй ещё!');
                } else if (data.status === 'gift') {
                    userData.stars = data.balance;
                    updateUI();
                    showToast('🎁 Подарок получен! +1 звезда!');
                } else if (data.status === 'error') {
                    showToast('❌ ' + data.message);
                }
            } catch(e) { console.log('Ошибка:', e); }
        };
        
        // ========== ОБНОВЛЕНИЕ UI ==========
        function updateUI() {
            // Полное имя
            const fullName = userData.firstName + (userData.lastName ? ' ' + userData.lastName : '');
            
            // Верхняя панель
            document.getElementById('userStars').textContent = userData.stars;
            document.getElementById('profileName').textContent = fullName;
            document.getElementById('profileUsername').textContent = userData.username ? '@' + userData.username : 'Без username';
            
            // Аватарка в верхней панели
            const avatar = document.getElementById('avatarContainer');
            if (userData.photoUrl) {
                avatar.innerHTML = '<img src="' + userData.photoUrl + '" alt="avatar">';
            } else {
                avatar.textContent = userData.firstName.charAt(0).toUpperCase();
                avatar.style.background = 'linear-gradient(135deg, #f7971e, #ffd200)';
            }
            
            // Попап профиля
            document.getElementById('popupName').textContent = fullName;
            document.getElementById('popupUsername').textContent = userData.username ? '@' + userData.username : 'Без username';
            document.getElementById('popupBalance').textContent = userData.stars;
            document.getElementById('popupEarned').textContent = userData.totalEarned;
            document.getElementById('popupNfts').textContent = userData.nftCount;
            document.getElementById('popupGifts').textContent = userData.giftsReceived;
            document.getElementById('popupSpent').textContent = userData.totalSpent;
            
            // Аватарка в попапе
            const popupAvatar = document.getElementById('popupAvatar');
            if (userData.photoUrl) {
                popupAvatar.innerHTML = '<img src="' + userData.photoUrl + '" alt="avatar">';
            } else {
                popupAvatar.textContent = userData.firstName.charAt(0).toUpperCase();
                popupAvatar.style.background = 'linear-gradient(135deg, #f7971e, #ffd200)';
            }
        }
        
        // ========== LIVE ЛЕНТА ==========
        function updateLiveFeed(events) {
            const scroll = document.getElementById('trackScroll');
            scroll.innerHTML = '';
            if (events && events.length > 0) {
                events.forEach(function(e) {
                    const span = document.createElement('span');
                    span.className = 'item';
                    span.innerHTML = '🎉 <span class="win">' + e.user_name + '</span> выиграл <span class="nft">' + e.nft_id + '</span>';
                    scroll.appendChild(span);
                });
                scroll.innerHTML = scroll.innerHTML + scroll.innerHTML;
            }
        }
        
        // ========== ОТКРЫТИЕ КЕЙСА ==========
        function openCase(caseName, price) {
            if (userData.stars < price) {
                showToast('❌ Не хватает звёзд! Нужно: ' + price);
                return;
            }
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: 'open_case',
                    case: caseName,
                    price: price
                }));
            }
        }
        
        // ========== ДОБАВИТЬ ЗВЁЗДЫ ==========
        function addStars() {
            if (tg) {
                tg.sendData(JSON.stringify({ action: 'get_gift' }));
            }
        }
        
        function buyStars() {
            showToast('🛒 Скоро здесь будет магазин звёзд!');
        }
        
        // ========== ПРОФИЛЬ ==========
        function openProfile() {
            document.getElementById('profilePopup').classList.add('show');
            updateUI();
        }
        
        function closeProfile() {
            document.getElementById('profilePopup').classList.remove('show');
        }
        
        document.getElementById('profilePopup').addEventListener('click', function(e) {
            if (e.target === this) closeProfile();
        });
        
        // ========== ВКЛАДКИ ==========
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                if (this.dataset.tab === 'profile') openProfile();
                else if (this.dataset.tab === 'modes') showToast('⚡ Режимы скоро появятся!');
            });
        });
        
        // ========== TOAST ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // ========== ПЕРЕХВАТ СООБЩЕНИЙ ==========
        if (tg) {
            tg.onEvent('message', function(message) {
                try {
                    const data = JSON.parse(message.text);
                    if (typeof data === 'object') window.handleBotResponse(data);
                } catch(e) {}
            });
        }
        
        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        setTimeout(function() {
            fetchUserData();
            fetchLiveFeed();
        }, 500);
        
        setInterval(fetchLiveFeed, 30000);
        
        console.log('Easy Gift Mini App loaded!');
    </script>
</body>
</html>
